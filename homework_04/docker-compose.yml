services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hw04_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - hw04_mssql_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost
        -U sa
        -P "$$MSSQL_SA_PASSWORD"
        -C
        -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hw04_mssql_init
    depends_on:
      mssql:
        condition: service_started
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - ./docker/init:/workspace/init:ro
      - ./sql:/workspace/sql:ro
    entrypoint: ["/bin/bash", "/workspace/init/init-db.sh"]
    restart: "no"

volumes:
  hw04_mssql_data: